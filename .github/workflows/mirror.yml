name: mirror
on:
  workflow_dispatch:
    inputs:
      code_repo:
        description: 'source repo for code (owner/name)'
        required: true
        default: 'arminkey04/azurlane-mod-menu'
      release_repo:
        description: 'repo holding the release to copy'
        required: true
        default: 'azzzddddd/Azurlane-Build'
      tag:
        description: 'release tag to copy'
        required: true
        default: '3.4.0-APK'
      pattern:
        description: 'asset glob'
        required: true
        default: 'bilibili-*'
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save workflow file
        run: cp .github/workflows/mirror.yml /tmp/mirror.yml
      - name: Mirror git history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE: ${{ inputs.code_repo }}
        run: |
          set -euo pipefail
          rm -rf /tmp/src
          git clone --quiet "https://github.com/${CODE}.git" /tmp/src
          cd /tmp/src
          git checkout -B main
          mkdir -p .github/workflows
          cp /tmp/mirror.yml .github/workflows/mirror.yml
          git config user.name "mirror-bot"
          git config user.email "mirror-bot@users.noreply.github.com"
          git add .github/workflows/mirror.yml
          git commit -m "chore: keep mirror workflow" --quiet
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push -f origin main
          git push -f origin --tags
      - name: Copy release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL: ${{ inputs.release_repo }}
          TAG: ${{ inputs.tag }}
          PAT: ${{ inputs.pattern }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/assets
          gh release download "$TAG" --repo "$REL" --pattern "$PAT" --dir /tmp/assets
          ls -lh /tmp/assets
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "${{ github.repository }}" --title "$TAG" --notes "Mirrored from $REL@$TAG"
          fi
          gh release upload "$TAG" /tmp/assets/* --repo "${{ github.repository }}" --clobber